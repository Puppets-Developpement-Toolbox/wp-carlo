# Structure du thème de test : deux modèles de page et un type de contenu.
# Chaque région est un bloc Gutenberg qui n'accepte que les sections qu'elle cite.
# Les sections viennent de puppets/library (templates/sections) : le thème n'en
# définit aucune. Pour tester une section à soi, créer
# templates/sections/<section>/base.php + base.yml dans ce thème.
# Après toute modification : supprimer les JSON d'acf/ concernés et recharger l'admin.

menus:
  main: Menu principal

regions:
  header: En-tête
  content: Contenu

templates:
  # Le contributeur choisit et ordonne les blocs, 3 au maximum.
  default:
    _label: Page éditoriale
    content:
      - _blocs: [!load sections/text, !load sections/image, !load sections/quote]
        _max: 3

  # Deux régions, chacune limitée à une seule section possible.
  landing:
    _label: Page templatisée
    header:
      - !load sections/image
    content: [!load sections/text, !load sections/quote]

types:
  project:
    wp_args:
      label: Projets
      supports: [title, thumbnail]
    template:
      _label: Fiche projet
      content: [!load sections/text]
